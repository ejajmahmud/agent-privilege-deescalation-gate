[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-privilege-deescalation-gate"
version = "0.1.0"
description = "Contextual least-privilege token manager stripping agent database write and admin capabilities immediately after task completion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-privilege-deescalation-gate = "agent_privilege_deescalation_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_privilege_deescalation_gate*"]
